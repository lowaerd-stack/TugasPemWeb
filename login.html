<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Masuk - AutoCare</title>


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="auth-body">


    <main class="auth-page">


        <!-- KIRI -->

        <section class="auth-left">

            <a href="index.html"
               class="auth-logo">

                <img src="assets/logo.png"
                     alt="AutoCare">

            </a>


            <div class="auth-left-content">

                <span>
                    AUTOCARE SERVICE & CARE
                </span>

                <h1>
                    Kelola servis kendaraan
                    dengan mudah dan terpercaya.
                </h1>

                <p>
                    Booking servis, pantau jadwal,
                    dan kelola kendaraan Anda
                    dalam satu tempat.
                </p>

            </div>

        </section>


        <!-- KANAN -->

        <section class="auth-right">

            <div class="auth-form">

                <div class="form-logo">

                    <img src="assets/logo.png"
                         alt="AutoCare">

                </div>


                <h2>
                    Selamat Datang
                </h2>

                <p class="form-subtitle">
                    Masuk untuk mengelola servis
                    kendaraan Anda.
                </p>


                <form action="index.html"
                      method="get">


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Masukkan email"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Masukkan password"
                               required>

                    </div>


                    <div class="form-options">

                        <label class="remember">

                            <input type="checkbox">

                            <span>
                                Ingat saya
                            </span>

                        </label>


                        <a href="#">
                            Lupa password?
                        </a>

                    </div>


                    <button type="submit"
                            class="auth-button">
                        Masuk
                    </button>


                </form>


                <p class="register-text">

                    Belum punya akun?

                    <a href="register.html">
                        Daftar sekarang
                    </a>

                </p>


                <a href="index.html"
                   class="back-home">

                    ← Kembali ke Beranda

                </a>

            </div>

        </section>

    </main>

</body>

</html>
