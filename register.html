
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - AutoCare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="navbar">
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="AutoCare">
      <span>AutoCare<small>SERVICE & CARE</small></span>
    </a>
    <a href="index.html" class="back-link">← Kembali ke Home</a>
  </header>

  <main class="auth-container">
    <section class="auth-intro">
      <span class="eyebrow">GABUNG BERSAMA KAMI</span>
      <h1>Mulai perjalanan merawat kendaraanmu.</h1>
      <p>Buat akun untuk mempermudah booking, jadwal, dan pencatatan servis.</p>
      <div class="auth-decoration">AUTOCARE <span>SERVICE & CARE</span></div>
    </section>

    <section class="auth-card">
      <h2>Buat Akun</h2>
      <p class="muted">Isi data berikut untuk mendaftar.</p>

      <form action="login.html" method="get">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Nama lengkap" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="telepon">Nomor Telepon</label>
          <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx" required>
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" name="password" placeholder="Buat kata sandi" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Daftar Sekarang</button>
      </form>

      <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </section>
  </main>

  <footer class="footer"><p>© 2026 AutoCare. SERVICE & CARE.</p></footer>
</body>
</html>
