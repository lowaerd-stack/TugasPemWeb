<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Daftar - AutoCare</title>


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="auth-body">


    <main class="auth-page">


        <!-- KIRI -->

        <section class="auth-left">

            <a href="index.html"
               class="auth-logo">

                <img src="assets/logo.png"
                     alt="AutoCare">

            </a>


            <div class="auth-left-content">

                <span>
                    AUTOCARE SERVICE & CARE
                </span>

                <h1>
                    Mulai kelola kendaraan
                    Anda bersama AutoCare.
                </h1>

                <p>
                    Buat akun untuk menikmati
                    kemudahan booking dan pengelolaan
                    servis kendaraan.
                </p>

            </div>

        </section>


        <!-- KANAN -->

        <section class="auth-right">

            <div class="auth-form register-form">

                <div class="form-logo">

                    <img src="assets/logo.png"
                         alt="AutoCare">

                </div>


                <h2>
                    Buat Akun
                </h2>

                <p class="form-subtitle">
                    Daftarkan akun Anda untuk
                    mulai menggunakan AutoCare.
                </p>


                <form action="login.html"
                      method="get">


                    <div class="form-group">

                        <label for="nama">
                            Nama Lengkap
                        </label>

                        <input type="text"
                               id="nama"
                               name="nama"
                               placeholder="Masukkan nama lengkap"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Masukkan email"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="nohp">
                            No. HP
                        </label>

                        <input type="tel"
                               id="nohp"
                               name="nohp"
                               placeholder="Masukkan nomor HP"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Masukkan password"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="konfirmasi">
                            Konfirmasi Password
                        </label>

                        <input type="password"
                               id="konfirmasi"
                               name="konfirmasi"
                               placeholder="Masukkan kembali password"
                               required>

                    </div>


                    <button type="submit"
                            class="auth-button">

                        Daftar Akun

                    </button>


                </form>


                <p class="register-text">

                    Sudah punya akun?

                    <a href="login.html">
                        Masuk
                    </a>

                </p>


                <a href="index.html"
                   class="back-home">

                    ← Kembali ke Beranda

                </a>

            </div>

        </section>

    </main>

</body>

</html>
